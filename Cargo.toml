[workspace]
resolver = "2"
members = [
    "crates/harvester-proto",
    "crates/harvesterd",
    "crates/harvester-client-core",
    "crates/harvester-cli",
    "crates/harvester",
]
# The gallery is a crate of its own with its own workspace and lockfile: it
# path-depends on a sibling gpui-mcp checkout that no clean clone has, and a
# workspace member's path deps are resolved unconditionally. See
# crates/harvester-gallery/Cargo.toml.
exclude = ["crates/harvester-gallery"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "sync",
    "fs",
    "time",
] }

# gpui's dependency tree with full debuginfo produces a multi-GB target dir;
# line tables keep panic backtraces readable at a fraction of the disk.
[profile.dev]
debug = "line-tables-only"

# harvesterd ships as a static musl binary uploaded over SSH; keep it small.
# Daemon-only on purpose: the gpui client is a desktop binary that wants frame
# time and unwinding, so these settings never reach `--release`. See
# docs/internals/harvesterd.md.
[profile.daemon-release]
inherits = "release"
opt-level = "z"
lto = true
strip = true
panic = "abort"

# Lint policy. Rationale and the per-lint verdicts live in docs/internals/lints.md.
# Member crates opt in with `lints.workspace = true`; harvester-gallery is its own
# workspace and carries its own copy.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"
let_underscore_drop = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Deliberately rejected: 42 sites use `.map(f).unwrap_or(d)`, and test helpers
# return `Option<T>` on purpose to compare against the function under test.
map_unwrap_or = "allow"
unnecessary_wraps = "allow"

# Directly contradicts `unreachable_pub`, which is the rule this codebase wants.
redundant_pub_crate = "allow"

# For library authors publishing an API; harvester ships binaries.
must_use_candidate = "allow"

# House rules that already had a lint.
use_self = "warn"

# Restriction lints are a menu, not a group — never enable the group.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
mod_module_files = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[workspace]
resolver = "2"
members = [
    "crates/harvester-proto",
    "crates/harvesterd",
    "crates/harvester-client-core",
    "crates/harvester-cli",
    "crates/harvester",
]
# The gallery is a crate of its own with its own workspace and lockfile: it
# path-depends on a sibling gpui-mcp checkout that no clean clone has, and a
# workspace member's path deps are resolved unconditionally. See
# crates/harvester-gallery/Cargo.toml.
exclude = ["crates/harvester-gallery"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "sync",
    "fs",
    "time",
] }

# gpui's dependency tree with full debuginfo produces a multi-GB target dir;
# line tables keep panic backtraces readable at a fraction of the disk.
[profile.dev]
debug = "line-tables-only"

# harvesterd ships as a static musl binary uploaded over SSH; keep it small.
# Daemon-only on purpose: the gpui client is a desktop binary that wants frame
# time and unwinding, so these settings never reach `--release`. See
# docs/internals/harvesterd.md.
[profile.daemon-release]
inherits = "release"
opt-level = "z"
lto = true
strip = true
panic = "abort"

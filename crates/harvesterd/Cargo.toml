[package]
name = "harvesterd"
version.workspace = true
edition.workspace = true

[dependencies]
harvester-proto = { path = "../harvester-proto" }
# Substring prefilter for the session-file scan. Free in binary size: already in
# the tree transitively via serde_json.
memchr = "2"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true

[dev-dependencies]
# Session-file fixtures for the fslist tests; never linked into the shipped binary.
tempfile = "3"

[lints]
workspace = true

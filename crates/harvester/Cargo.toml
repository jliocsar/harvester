# The desktop client. gpui lives here and only here — same quarantine logic
# as clap-in-harvester-cli: the library crates stay UI-framework-free.
[package]
name = "harvester"
version.workspace = true
edition.workspace = true

[dependencies]
# gpui comes from zed's git rather than crates.io because gpui-component does
# (SPEC C11): zed split gpui into gpui + gpui_platform and never published
# gpui_platform, so no crates.io release of either can exist. Neither URL
# carries a `rev` — upstream pins by lockfile and so do we, which makes a bump
# an explicit `cargo update -p gpui`, never an incidental one.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# The widget layer. Only the languages the transcript actually renders are
# enabled; the full `tree-sitter-languages` set is another 32 grammar crates.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f96f1576", features = [
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-bash",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-diff",
    "tree-sitter-toml",
    "tree-sitter-yaml",
] }
# Lucide SVGs behind `IconName`. Without an AssetSource every icon renders blank.
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "f96f1576" }
# Lets gpui-mcp (the MCP server) attach to the gallery and drive it: dump the
# a11y tree, inject keys. Inert unless launched with `GPUI_MCP=1` on a debug
# build, and only the gallery calls `install` — the client binary never does.
# Its gpui dep is the same bare zed-git source as ours, pinned by lockfile to
# the same commit; a mismatched build is caught by the bridge handshake.
gpui-mcp-bridge = { path = "../../../gpui-mcp/crates/gpui-mcp-bridge" }
harvester-client-core = { path = "../harvester-client-core" }
harvester-proto = { path = "../harvester-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Uuidv7 sids minted client-side for ghost-chat starts (time-sortable — the
# sidebar's newest-first order keys on the sid). Client crate only.
uuid = { version = "1", features = ["v7"] }

[[bin]]
# The component gallery: a dev-only story catalog. It lives in `src/gallery/`
# rather than `src/bin/` so the `no_comments` lint (which skips `bin/`) covers
# it — the gallery is real code, not a throwaway spike.
name = "gallery"
path = "src/gallery/main.rs"
